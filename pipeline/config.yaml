# Defense Procurement Intelligence Configuration
project:
  id: defense-procurement
  name: "Defense Procurement Intelligence"
  description: "Global defense spending tracker via public contracts."

openrouter:
  model: "nvidia/nemotron-3-super-120b-a12b:free"
  fallback_model: "z-ai/glm-5.2:free"

news_query: "(procurement OR contracting OR military OR defense)"
include_forex: true

sources:
  - name: "Google News RSS"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
